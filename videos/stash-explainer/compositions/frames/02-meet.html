<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="../../assets/stash.css" />
      <link rel="stylesheet" href="../../assets/palette.css" />
      <style>
        #root { position: absolute; inset: 0; }
        #f2-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
        #f2-lock { display: flex; align-items: center; gap: 46px; }
        #f2-icon { width: 260px; height: 260px; display: block; filter: drop-shadow(0 30px 60px rgba(14, 116, 144, 0.45)); }
        #f2-word { font-size: 230px; }
        #f2-tag { font-size: 56px; max-width: 1400px; text-align: center; }
        #f2-tag span { display: inline-block; }
        #f2-tag b { color: var(--ink); font-weight: 700; display: inline-block; }
        #f2-rail { position: absolute; left: 0; right: 0; bottom: 84px; display: flex; justify-content: center; gap: 46px; }
        #f2-rail span { display: block; }
      </style>
      <div data-hf-id="hf-ohul" id="root" data-composition-id="f2-meet" data-width="1920" data-height="1080">
        <div data-hf-id="hf-wua0" class="scene">
          <div data-hf-id="hf-zx1w" class="dots"></div>
          <div data-hf-id="hf-2oyd" id="f2-glow" class="glow" style="left:360px; top:-260px; width:1200px; height:1200px"></div>
          <div data-hf-id="hf-8p4a" id="f2-glow2" class="glow violet" style="left:1180px; top:420px; width:900px; height:900px"></div>
          <div data-hf-id="hf-f3qk" id="f2-stage">
            <div data-hf-id="hf-z5m7" id="f2-lock">
              <img data-hf-id="hf-o5t0" id="f2-icon" src="../../assets/stash-icon.png" alt="" />
              <h1 data-hf-id="hf-upti" id="f2-word" class="headline">Stash</h1>
            </div>
            <p data-hf-id="hf-ystu" id="f2-tag" class="sub"><span data-hf-id="hf-e26j" id="f2-t1">Everything you copy,</span> <b data-hf-id="hf-kurw" id="f2-t2">right where you're typing.</b></p>
          </div>
          <div data-hf-id="hf-iy3s" id="f2-rail" class="eyebrow"><span data-hf-id="hf-u1e6">Clipboard manager</span><span data-hf-id="hf-1bmq">·</span><span data-hf-id="hf-fgmu">macOS</span><span data-hf-id="hf-8hs6">·</span><span data-hf-id="hf-em5i">⌘⇧V</span></div>
        </div>
      </div>
      <script>
        (function () {
          const D = 4.2;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#f2-glow", { scale: 0.8, opacity: 0.4 }, { scale: 1.1, opacity: 1, duration: D, ease: "sine.out" }, 0);
          tl.fromTo("#f2-glow2", { x: 0 }, { x: -80, duration: D, ease: "sine.inOut" }, 0);

          // icon blooms, then the wordmark unmasks from behind it ("Meet… Stash")
          tl.fromTo("#f2-icon", { scale: 0, rotation: -12, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.15);
          tl.fromTo("#f2-word", { clipPath: "inset(0 100% 0 0)", x: -60 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.7, ease: "power3.out" }, 0.55);

          // "Everything you copy, right where you're typing."
          tl.fromTo("#f2-t1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.3);
          tl.fromTo("#f2-t2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.3);
          tl.fromTo("#f2-rail span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.06, ease: "power2.out" }, 2.7);

          tl.to("#f2-stage, #f2-rail", { opacity: 0, scale: 0.98, duration: 0.3, ease: "power2.in" }, D - 0.32);

          window.__timelines["f2-meet"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
