            <div data-hf-id="hf-rgbw" class="keys"><div data-hf-id="hf-a9jn" id="f3-k1" class="key sm">⌘<span data-hf-id="hf-2nmq" class="on">⌘</span></div><div data-hf-id="hf-y1xz" id="f3-k2" class="key sm">⇧<span data-hf-id="hf-oymj" class="on">⇧</span></div><div data-hf-id="hf-u4gn" id="f3-k3" class="key sm">V<span data-hf-id="hf-kavc" class="on">V</span></div></div>
            <div data-hf-id="hf-c8nb" id="f3-then">then <div data-hf-id="hf-8kdu" id="f3-k4" class="key sm">2<span data-hf-id="hf-vfg4" class="on">2</span></div> pastes</div>

      </div>
      <script>
        (function () {
          const D = 8.6;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          function press(key, at, hold) {
            tl.to(key, { y: 7, duration: 0.07, ease: "power1.in" }, at)
              .to(key.querySelector(".on"), { opacity: 1, duration: 0.05 }, at)
              .to(key, { y: 0, duration: 0.3, ease: "power3.out" }, at + 0.12)
              .to(key.querySelector(".on"), { opacity: 0, duration: 0.3 }, at + hold);
          }
          function selRow(row, at) {
            tl.to(row, { color: "#ffffff", duration: 0.12 }, at);
            tl.to(row.querySelector(".num"), { backgroundColor: "rgba(255,255,255,0.24)", duration: 0.12 }, at);
          }
          function unselRow(row, at) {
            tl.to(row, { color: "#16161d", duration: 0.12 }, at);
            tl.to(row.querySelector(".num"), { backgroundColor: "rgba(22,22,40,0.07)", duration: 0.12 }, at);
          }

          tl.fromTo("#f3-glow", { scale: 1 }, { scale: 1.12, duration: D / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);

          // same note as the hook, still waiting on the address
          tl.fromTo("#f3-note", { scale: 0.97, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
          tl.set("#f3-typed", { display: "none" }, 0);
          for (let t = 0.5; t < 2.2; t += 0.5) tl.set("#f3-caret", { opacity: Math.round(t / 0.5) % 2 ? 0 : 1 }, t);
          tl.set("#f3-caret", { opacity: 1 }, 2.2);

          tl.fromTo("#f3-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
          tl.fromTo("#f3-head", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 3.3);

          // "Press Command Shift V"
          tl.fromTo(["#f3-k1", "#f3-k2", "#f3-k3"], { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.07 }, 0.45);
          press($("#f3-k1"), 1.0, 1.3);
          press($("#f3-k2"), 1.08, 1.22);
          press($("#f3-k3"), 1.16, 1.14);

          // "…a menu opens at your cursor, with your recent copies"
          tl.fromTo("#f3-pm", { scale: 0.9, opacity: 0, y: -12 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.3);
          tl.fromTo(["#f3-r1", "#f3-r2", "#f3-r3", "#f3-r4", "#f3-r5"], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.07, ease: "power2.out" }, 2.4);
          tl.set("#f3-r1", { color: "#ffffff" }, 0);
          tl.set("#f3-r1 .num", { backgroundColor: "rgba(255,255,255,0.24)" }, 0);
          tl.fromTo("#f3-hl", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.45);

          // "Hit a number…" → 2
          tl.fromTo("#f3-then", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.3);
          press($("#f3-k4"), 5.85, 0.9);
          tl.to("#f3-hl", { y: 60, duration: 0.16, ease: "power2.out" }, 5.88);
          unselRow($("#f3-r1"), 5.88);
          selRow($("#f3-r2"), 5.88);

          // "…and it's pasted."
          tl.to("#f3-pm", { scale: 0.96, opacity: 0, duration: 0.2, ease: "power2.in" }, 6.2);
          tl.set("#f3-typed", { display: "inline-block" }, 6.38);
          tl.fromTo("#f3-typed", { backgroundColor: "rgba(14,116,144,0.45)", scale: 1.04 }, { backgroundColor: "rgba(14,116,144,0.14)", scale: 1, duration: 0.8, ease: "power2.out" }, 6.38);

          tl.to(["#f3-note", "#f3-right"], { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, D - 0.32);

          window.__timelines["f3-menu"] = tl;
        })();
      </script>
