        (function () {
          const D = 8.0;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          function press(key, on, at, hold) {
            tl.to(key, { y: 8, duration: 0.07, ease: "power1.in" }, at)
              .to(on, { opacity: 1, duration: 0.05 }, at)
              .to(key, { y: 0, duration: 0.3, ease: "power3.out" }, at + 0.12)
              .to(on, { opacity: 0, duration: 0.25 }, at + hold);
          }

          tl.fromTo("#f4-glow", { scale: 1 }, { scale: 1.15, duration: D / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
          tl.fromTo("#f4-glow2", { x: 0 }, { x: -70, duration: D, ease: "sine.inOut" }, 0);

          // "Pin the things you type all the time."
          tl.fromTo("#f4-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
          tl.fromTo("#f4-head", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.25);
          tl.fromTo("#f4-menu", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.45);
          tl.fromTo(["#f4-r1", "#f4-r2", "#f4-r3"], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.09, ease: "power2.out" }, 0.65);
          tl.fromTo(["#f4-s1", "#f4-s2", "#f4-s3"], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, stagger: 0.18, ease: "power3.out" }, 1.25);
          tl.fromTo(["#f4-t1", "#f4-t2", "#f4-t3"], { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.1, ease: "power3.out" }, 1.5);
          tl.set(["#f4-v1", "#f4-v2", "#f4-v3"], { opacity: 0 }, 0);

          // the ⌃⌥ anchor arrives and never moves; only the number cycles
          tl.fromTo(["#f4-kc", "#f4-ko", "#f4-num"], { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power3.out" }, 2.6);
          tl.set(["#f4-n2", "#f4-n3"], { yPercent: 100 }, 0);

          const beats = [
            { at: 3.55, n: "#f4-n1", prev: null, row: "#f4-r1", slot: "#f4-s1", ring: "#f4-g1", val: "#f4-v1" },
            { at: 4.85, n: "#f4-n2", prev: "#f4-n1", row: "#f4-r2", slot: "#f4-s2", ring: "#f4-g2", val: "#f4-v2" },
            { at: 5.95, n: "#f4-n3", prev: "#f4-n2", row: "#f4-r3", slot: "#f4-s3", ring: "#f4-g3", val: "#f4-v3" },
          ];
          beats.forEach((b, i) => {
            if (b.prev) {
              tl.to(b.prev, { yPercent: -100, duration: 0.18, ease: "power2.in" }, b.at - 0.3);
              tl.to(b.n, { yPercent: 0, duration: 0.2, ease: "power2.out" }, b.at - 0.15);
              const pb = beats[i - 1];
              tl.to(pb.ring, { opacity: 0, duration: 0.25 }, b.at);
              tl.to(pb.row, { backgroundColor: "rgba(14,116,144,0)", duration: 0.25 }, b.at);
            }
            press($("#f4-kc"), $("#f4-kc .on"), b.at, 0.5);
            press($("#f4-ko"), $("#f4-ko .on"), b.at + 0.03, 0.47);
            press($("#f4-num"), $("#f4-on"), b.at + 0.06, 0.44);
            tl.to("#f4-num", { color: "#ffffff", duration: 0.05 }, b.at + 0.06);
            tl.to("#f4-num", { color: "#16161d", duration: 0.25 }, b.at + 0.5);
            tl.to(b.row, { backgroundColor: "rgba(14,116,144,0.07)", duration: 0.15 }, b.at + 0.06);
            tl.to(b.slot, { keyframes: { scale: [1, 1.25, 1] }, duration: 0.35, ease: "power2.out" }, b.at + 0.06);
            tl.to(b.ring, { opacity: 1, duration: 0.15 }, b.at + 0.12);
            tl.fromTo(b.val, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, b.at + 0.14);
          });
