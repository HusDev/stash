      <script>
        (function () {
          const D = 7.8;
          const tl = gsap.timeline({ paused: true });
          const $ = (s) => document.querySelector(s);
          function typeOn(el, start, gap) {
            const text = el.textContent;
            el.textContent = "";
            const spans = [...text].map((ch) => {
              const s = document.createElement("span");
              s.textContent = ch;
              s.style.display = "none";
              el.appendChild(s);
              return s;
            });
            spans.forEach((s, i) => tl.set(s, { display: "inline" }, start + i * gap));
            return start + spans.length * gap;
          }
          const ON = { backgroundColor: "rgba(91,94,240,0.12)", color: "#3a3dc4", duration: 0.15 };
          const OFF = { backgroundColor: "rgba(91,94,240,0)", color: "#55555f", duration: 0.15 };

          tl.fromTo("#f5-glow", { scale: 0.95 }, { scale: 1.1, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f5-ghost", { x: 0 }, { x: 80, duration: D, ease: "none" }, 0);

          // "Need something older?" the full window floats in
          tl.fromTo("#f5-win", { y: 70, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.05);
          tl.fromTo("#f5-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.4);
          tl.set("#f5-c0", ON, 0);
          tl.set(["#f5-hits", "#f5-code"], { opacity: 0 }, 0);
          tl.set("#f5-w2", { display: "none" }, 0);

          // "Search everything." types greet; the list filters
          tl.fromTo("#f5-h1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.55);
          const typed = typeOn($("#f5-q"), 1.75, 0.09);
          tl.to(["#f5-all", "#f5-prose"], { opacity: 0, duration: 0.18 }, typed);
          tl.fromTo("#f5-hits", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, typed + 0.05);
          tl.to("#f5-code", { opacity: 1, duration: 0.25 }, typed + 0.05);

          // "Filter links, images, code, or colors" chips step on each word
          tl.fromTo("#f5-h2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 2.9);
          const steps = [["#f5-c0", "#f5-c1", 3.6], ["#f5-c1", "#f5-c2", 4.02], ["#f5-c2", "#f5-c3", 4.6], ["#f5-c3", "#f5-c4", 5.1], ["#f5-c4", "#f5-c3", 5.5]];
          steps.forEach(([from, to, at]) => { tl.to(from, OFF, at); tl.to(to, ON, at); });

          // "…and edit before you paste" Edit presses, Hello → Hey
          tl.fromTo("#f5-h3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 5.6);
          tl.to("#f5-edit", { scale: 0.92, backgroundColor: "#5b5ef0", color: "#ffffff", duration: 0.08 }, 5.85);
          tl.to("#f5-edit", { scale: 1, duration: 0.25, ease: "power3.out" }, 5.95);
          tl.to("#f5-code", { borderColor: "rgba(91,94,240,1)", backgroundColor: "rgba(91,94,240,0.05)", duration: 0.2 }, 5.95);
          tl.set("#f5-w1", { display: "none" }, 6.35);
          tl.set("#f5-w2", { display: "inline" }, 6.6);
          tl.fromTo("#f5-w2", { backgroundColor: "rgba(255,196,0,0.6)" }, { backgroundColor: "rgba(255,196,0,0)", duration: 0.9 }, 6.6);

          tl.to(["#f5-win", "#f5-left"], { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, D - 0.32);

          window.__timelines["f5-window"] = tl;
        })();
