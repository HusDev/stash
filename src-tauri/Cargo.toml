[package]
name = "stash"
version = "0.1.0"
description = "A fast, keyboard-first clipboard manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
core-foundation = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
